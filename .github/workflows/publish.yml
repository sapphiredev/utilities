name: Publish
run-name: Publish @sapphire/${{ inputs.package }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: The package to release
        required: true
        type: choice
        options:
          - async-queue
          - bitfield
          - cron
          - decorators
          - discord-utilities
          - discord.js-utilities
          - duration
          - eslint-config
          - eslint-plugin-result
          - event-iterator
          - fetch
          - iterator-utilities
          - lexure
          - node-utilities
          - phisherman
          - prettier-config
          - ratelimits
          - result
          - snowflake
          - stopwatch
          - string-store
          - time-utilities
          - timer-manager
          - timestamp
          - ts-config
          - utilities
      skip-automatic-bump:
        description: Whether to skip the automatic bumping of the packageversion
        required: false
        default: false
        type: boolean
      prNumber:
        description: The number of the PR that is being deployed
        required: false
        type: string
      ref:
        description: The branch that is being deployed. Should be a branch on the given repository
        required: false
        default: main
        type: string
      prerelease:
        description: Whether to publish a prerelease version (default `false`)
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: write

jobs:
  PublishPackage:
    name: Publish @sapphire/${{ inputs.package}}
    uses: sapphiredev/.github/.github/workflows/reusable-publish.yml@main
    with:
      build: true
      project-name: '@sapphire/${{ inputs.package}}'
      working-directory: packages/${{ inputs.package }}
      skip-automatic-bump: ${{ inputs.skip-automatic-bump }}
      pr-number: ${{ inputs.prNumber }}
      ref: ${{ inputs.ref }}
      prerelease: ${{ inputs.prerelease }}
    secrets:
      SKYRA_TOKEN: ${{ secrets.SKYRA_TOKEN }}
